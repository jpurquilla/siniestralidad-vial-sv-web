<p class="unidad" data-unidad>Siniestros esperados en la franja seleccionada.</p>
<p class="aviso-orden" data-aviso-orden>
  El orden dentro de cada tercil es aproximado: los distritos de un mismo grupo tienen valores
  esperados parecidos y su posición relativa puede variar.
</p>
<app-ranking-grupo
  titulo="Tercil alto"
  [items]="alto()"
  [spearman]="spearmanAlto()"
  [distritoSeleccionado]="distritoSeleccionado()"
  (seleccionar)="seleccionar.emit($event)"
/>
<app-ranking-grupo
  titulo="Tercil medio"
  [items]="medio()"
  [spearman]="spearmanMedio()"
  [distritoSeleccionado]="distritoSeleccionado()"
  (seleccionar)="seleccionar.emit($event)"
/>
<app-ranking-grupo
  titulo="Tercil bajo"

  [spearman]="spearmanBajo()"
  [distritoSeleccionado]="distritoSeleccionado()"
  (seleccionar)="seleccionar.emit($event)"
