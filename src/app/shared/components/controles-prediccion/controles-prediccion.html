<div class="controles">
  <label class="control">
    <span class="control-etiqueta">Fecha</span>
    <input
      type="date"
      data-testid="fecha"
      class="control-entrada"
      [value]="fecha()"
      (change)="onFechaChange($event)"
    />
    @if (usaUltimoParque()) {
      <span class="nota-control nota-parque" data-testid="aviso-parque">
        Para esta fecha se usa el último dato disponible de parque vehicular.
      </span>
    }
  </label>

  <label class="control">
    <span class="control-etiqueta">Franja horaria</span>
    <select data-testid="franja" class="control-entrada" (change)="onFranjaChange($event)">
      @for (f of franjas; track f.valor) {
        <option [value]="f.valor" [selected]="f.valor === franja()">{{ f.etiqueta }}</option>
      }
    </select>
    <span class="nota-control" data-testid="nota-franja">
      La predicción varía según la franja horaria.
    </span>
  </label>

  <div class="control control-lluvia">
    <label class="control-etiqueta" for="escenario-lluvia">
      Precipitación mensual
      <span class="control-valor" data-testid="prcp-texto">{{ escenarioTexto() }}</span>
    </label>
    <input
      id="escenario-lluvia"
      type="range"
      data-testid="prcp"
      class="control-slider"
      min="-100"
      max="100"
      step="5"
      [value]="escenarioPct()"
      (input)="onEscenarioChange($event)"
    />
    <div class="extremos-slider" aria-hidden="true">
      <span>Sin lluvia</span>
      <span>Lluvia normal</span>
      <span>El doble de lo normal</span>
    </div>
    @if (efectoTexto(); as texto) {
      <div class="efecto-total" data-testid="prcp-efecto">
        <span class="control-etiqueta">Efecto en el total nacional</span>
        <span class="efecto">{{ texto }}</span>
      </div>
    }
    <p class="nota-lluvia" data-testid="prcp-escalonado">
      El efecto de la lluvia es escalonado: el modelo responde a partir de ciertos niveles
      mensuales, por eso algunos distritos no cambian.
    </p>
    @if (escenarioPct() !== 0) {
      <button type="button" class="enlace" data-testid="prcp-restablecer" (click)="restablecer()">
        Volver a lluvia normal
      </button>
    }
  </div>
</div>
