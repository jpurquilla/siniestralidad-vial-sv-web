<div class="shell" data-app-shell>
  <nav class="sidebar" data-app-sidebar>
    <div class="marca" data-app-title-block>
      <img class="logo" data-app-logo src="favicon.svg" alt="" width="32" height="32" />
      <div class="marca-texto">
        <h1 class="titulo">Siniestralidad Vial SV</h1>
        <div class="subtitulo">Predicción de siniestralidad vial</div>
      </div>
    </div>

    <div class="nav-list" data-nav-list>
      @for (seccion of secciones; track seccion.titulo) {
        <div class="nav-seccion">
          <div class="nav-seccion-titulo">{{ seccion.titulo }}</div>
          @for (item of seccion.items; track item.ruta) {
            <a
              class="nav-item"
              [routerLink]="item.ruta"
              [queryParamsHandling]="item.conservarFiltros ? 'preserve' : ''"
              routerLinkActive="activo"
              [routerLinkActiveOptions]="{ exact: !!item.exacta }"
            >
              <span class="nav-num">{{ item.num }}</span>
              <span>{{ item.label }}</span>
            </a>
          }
        </div>
      }
    </div>
  </nav>

  <main class="contenido" data-app-main>
    <router-outlet />
  </main>
</div>
